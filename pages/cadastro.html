<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Fundamentos e Estruturação</title>
</head>
<body>
	<header>
		<nav>
			<a href="index.html">Sobre</a>
			<a href="projetos.html">Projetos</a>
			<a href="cadastro.html">Cadastro</a>
		</nav>
	</header>
	<main>
		
		    <h1>Formulário de Cadastro de Voluntário</h1>

    <form action="#" method="post">

        <!-- Dados Pessoais -->
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" required minlength="3" maxlength="100"><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="cpf">CPF:</label><br>
            <input type="text" id="cpf" name="cpf" 
                   pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                   placeholder="000.000.000-00" 
                   title="Digite o CPF no formato 000.000.000-00" 
                   required><br><br>

            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone"
                   pattern="\(\d{2}\)\s\d{4,5}-\d{4}"
                   placeholder="(99) 99999-9999"
                   title="Digite o telefone no formato (99) 99999-9999"
                   required><br><br>

            <label for="nascimento">Data de Nascimento:</label><br>
            <input type="date" id="nascimento" name="nascimento" required><br><br>
        </fieldset>

        <!-- Endereço -->
        <fieldset>
            <legend>Endereço</legend>

            <label for="endereco">Endereço:</label><br>
            <input type="text" id="endereco" name="endereco" required><br><br>

            <label for="cep">CEP:</label><br>
            <input type="text" id="cep" name="cep"
                   pattern="\d{5}-\d{3}"
                   placeholder="00000-000"
                   title="Digite o CEP no formato 00000-000"
                   required><br><br>

            <label for="cidade">Cidade:</label><br>
            <input type="text" id="cidade" name="cidade" required><br><br>

            <label for="estado">Estado:</label><br>
            <input type="text" id="estado" name="estado" maxlength="2" 
                   placeholder="UF" 
                   title="Informe a sigla do estado, ex: SP"
                   required><br><br>
        </fieldset>

        <input type="submit" value="Enviar Cadastro">

    </form>

	</main>
</body>
</html>
